<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ConviTEC | Catálogo global</title>
    <script src="/catalogo-global.js" defer></script>
</head>
<body>
    <main>
        <h1>Catálogo global</h1>

        <nav>
            <a href="/index.html">Volver al inventario local</a>
        </nav>

        <p id="estado" role="status">Cargando catálogo global…</p>

        <table id="tabla-global" hidden>
            <caption>Existencias por producto y sede</caption>
            <thead>
                <tr>
                    <th scope="col">Código de producto</th>
                    <th scope="col">Sede</th>
                    <th scope="col">Existencias</th>
                    <th scope="col">Reservadas</th>
                    <th scope="col">Disponibles</th>
                </tr>
            </thead>
            <tbody id="registros-globales"></tbody>
        </table>
    </main>
</body>
</html>
