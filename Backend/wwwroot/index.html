<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ConviTEC | Inventario local</title>
    <script src="inventario.js" defer></script>
</head>
<body>
    <main>
        <h1>Inventario local</h1>
        <p id="estado" role="status">Cargando inventario…</p>

        <table id="tabla-inventario" hidden>
            <caption>Productos de la sede</caption>
            <thead>
                <tr>
                    <th scope="col">Código</th>
                    <th scope="col">Producto</th>
                    <th scope="col">Categoría</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Existencias</th>
                    <th scope="col">Disponibles</th>
                </tr>
            </thead>
            <tbody id="productos"></tbody>
        </table>
    </main>
</body>
</html>
