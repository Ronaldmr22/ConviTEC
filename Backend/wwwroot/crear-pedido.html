<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ConviTEC | Crear pedido</title>
    <link rel="stylesheet" href="/estilos.css">
    <script src="/crear-pedido.js" defer></script>
    <script src="/sede.js" defer></script>
</head>
<body>
    <header class="barra">
        <div class="identidad-sede">
            <strong>ConviTEC</strong>
            <span id="sede-actual" class="etiqueta-sede" role="status">Consultando sede…</span>
        </div>
        <nav aria-label="Navegación principal">
            <a href="/">Inventario local</a>
            <a href="/catalogo-global.html">Catálogo global</a>
            <a href="/crear-pedido.html" aria-current="page">Crear pedido</a>
            <a href="/historial-ventas.html">Historial de ventas</a>
            <a href="/estadisticas-ventas.html">Estadísticas</a>
        </nav>
    </header>

    <main class="panel">
        <h1>Crear pedido</h1>

        <form id="formulario-pedido">
            <label for="destino">Destino de entrega</label>
            <select id="destino" name="destino" required>
                <option value="">Selecciona un destino</option>
                <option value="LIB">Liberia</option>
                <option value="1">Cañas</option>
                <option value="ALA">Alajuela</option>
                <option value="3">Orotina</option>
                <option value="4">Puntarenas</option>
                <option value="5">Heredia</option>
                <option value="SJO">San José</option>
                <option value="7">Cartago</option>
                <option value="8">Guápiles</option>
                <option value="9">Turrialba</option>
                <option value="10">Paraíso</option>
                <option value="11">Siquirres</option>
                <option value="LIM">Limón</option>
            </select>

            <fieldset>
                <legend>Productos del pedido</legend>
                <p id="estado-catalogo" role="status">Cargando productos…</p>
                <div id="lineas"></div>
                <button id="agregar-producto" type="button" disabled>Agregar producto</button>
            </fieldset>
            <button type="submit">Revisar pedido</button>
            <section id="resumen-pedido" hidden>
                <h2>Resumen del pedido</h2>
                <p id="resumen-destino"></p>
                <ul id="resumen-productos"></ul>
            </section>
        </form>

        <template id="plantilla-producto">
            <div class="linea-producto">
                <label>
                    Producto
                    <select name="codigoProducto" required>
                        <option value="">Selecciona un producto</option>
                    </select>
                </label>

                <label>
                    Cantidad
                    <input name="cantidad" type="number" min="1" step="1" value="1" required>
                </label>

                <button type="button" class="quitar-producto">Quitar producto</button>
            </div>
        </template>
    </main>
</body>
</html>
